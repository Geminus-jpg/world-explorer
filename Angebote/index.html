  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1b2a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #0a1628;
      border-bottom: 1px solid #1e3a5f;
      padding: 22px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;

      align-items: center;
    }

    .header-left span {

      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .header-left h1 {
      color: #f0f6ff;

      font-weight: 800;

    .kw-badge {

<body>

<header>

      <span>🛒 Forkcast</span>

    </div>

</header>

<div class="filters">

  </div>
</div>

<main>
  <div class="stats-row" id="stats-row" style="display:none">
    <div class="stat-card">
      <div class="stat-label">Angebote</div>
      <div class="stat-value" id="stat-count">–</div>

    <div class="stat-card">

  <div id="content">
    <div class="loading">
      <div class="loading-emoji">🛒</div>
      <p>Angebote werden geladen…</p>
    </div>

</main>

<script>
  // ── Datenquelle: Supabase direkt (kein Backend mehr nötig) ──────────
  // Der Publishable Key ist für den Browser gedacht und öffentlich.
  // Row Level Security erlaubt damit nur LESEN von angebote/preishistorie
  // (inkl. View angebote_mit_historie) — alle anderen Tabellen sind gesperrt.
  const SUPABASE_URL = "https://gycshdraqunwllkaoqfs.supabase.co";
  const SUPABASE_KEY = "sb_publishable_0U4zDLDqyOkkckye2P0Xvg_bI7jI6dx";

  let allDeals = [];
  let rawDeals = [];
  let renderedDeals = [];
  let activeStore = "";

  async function sb(path) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY } });
    if (!r.ok) throw new Error(`Supabase ${r.status}: ${(await r.text()).substring(0, 120)}`);
    return r.json();
  }

  // PostgREST liefert höchstens 1000 Zeilen pro Anfrage (still gekappt) →
  // seitenweise holen, bis eine Seite nicht mehr voll ist.
  async function sbAll(path, pageSize = 1000) {
    const out = [];
    for (let offset = 0; ; offset += pageSize) {
      const rows = await sb(`${path}&limit=${pageSize}&offset=${offset}`);
      out.push(...rows);
      if (rows.length < pageSize) return out;
    }
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Lokales Datum als YYYY-MM-DD (toISOString wäre UTC → nachts falscher Tag)
  function isoLokal(date) { return date.toLocaleDateString("sv-SE"); }

  // KW berechnen
  const d = new Date();
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  const kw = Math.ceil((((dt - y) / 86400000) + 1) / 7);
  document.getElementById("kw-badge").textContent = `KW ${kw}`;

  // ── Countdown statt Datum ───────────────────────────────────
  function daysUntil(str) {
    if (!str) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const expiry = new Date(str); expiry.setHours(0,0,0,0);
    const days = Math.round((expiry - today) / 86400000);
    if (days < 0)  return null;
    if (days === 0) return { text: "Läuft heute ab", color: "#ef4444" };
    if (days === 1) return { text: "Noch 1 Tag",      color: "#f59e0b" };
    if (days <= 3)  return { text: `Noch ${days} Tage`, color: "#f59e0b" };
    if (days <= 7)  return { text: `Noch ${days} Tage`, color: "#7ca8cc" };
    return null;
  }

  // ── Deal-Helper: offizieller Rabatt ODER historischer Deal ──
  // ist_historischer_deal / preis_historisch_avg kommen fertig aus der
  // View angebote_mit_historie (Grundpreis-Vergleich, siehe sql/ im Repo).
  function hasOfficialDiscount(d) {
    const preis = parseFloat(d.preis || 0);
    const norm  = parseFloat(d.normalpreis || 0);
    return norm > preis && preis > 0;
  }

  function isHistDeal(d) {
    return !hasOfficialDiscount(d)
      && parseFloat(d.preis || 0) > 0
      && d.ist_historischer_deal === true
      && parseFloat(d.preis_historisch_avg || 0) > 0;
  }

  function effSaved(d) {
    const preis = parseFloat(d.preis || 0);
    if (hasOfficialDiscount(d)) return parseFloat(d.normalpreis || 0) - preis;
    if (isHistDeal(d))          return parseFloat(d.preis_historisch_avg || 0) - preis;
    return 0;
  }

  function effRabatt(d) {
    const preis = parseFloat(d.preis || 0);
    if (hasOfficialDiscount(d)) {
      const norm = parseFloat(d.normalpreis || 0);
      return d.rabatt_prozent ? parseFloat(d.rabatt_prozent) : ((1 - preis / norm) * 100);
    }
    if (isHistDeal(d)) {
      return (1 - preis / parseFloat(d.preis_historisch_avg)) * 100;
    }
    return 0;
  }

  function istIrgendeinDeal(d) {
    return hasOfficialDiscount(d) || isHistDeal(d);
  }

  // ── Sparkline ──────────────────────────────────────────────
  function drawSparkline(prices, width=140, height=44) {
    if(!prices || prices.length < 2) return '<span style="color:#4a7fa5;font-size:12px">Nicht genug Daten</span>';
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = max - min || 0.01;
    const avg = prices.reduce((a,b)=>a+b,0)/prices.length;
    const cur = prices[prices.length-1];
    const isRealDeal = cur <= avg * 0.9;
    const color = isRealDeal ? '#22c55e' : cur <= avg ? '#f59e0b' : '#ef4444';

    const pts = prices.map((p,i)=>{
      const x = (i/(prices.length-1))*(width-4)+2;
      const y = height-2 - ((p-min)/range)*(height-4);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const cx = (width-2).toFixed(1);
    const cy = (height-2-((cur-min)/range)*(height-4)).toFixed(1);

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="display:block">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="4" fill="${color}"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px">
      <span style="color:#4a7fa5">Tief: ${min.toFixed(2)}€</span>
      <span style="color:${color};font-weight:700">${isRealDeal?'✓ Echter Deal':'~ Durchschnitt'}</span>
      <span style="color:#4a7fa5">Hoch: ${max.toFixed(2)}€</span>
    </div>`;
  }

  // Montag der Kalenderwoche als Schlüssel (erfasst_am ist UTC ohne Zeitzone)
  function wochenStart(ts) {
    const t = new Date(ts.replace(" ", "T") + (ts.endsWith("Z") ? "" : "Z"));
    const wd = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - wd);
    return t.toISOString().substring(0, 10);
  }

  // Ein Punkt pro FRÜHERER Woche + aktueller Preis als letzter Punkt.
  // Wie in der View: hat das Angebot einen Grundpreis, wird der historische
  // Grundpreis auf die aktuelle Packung umgerechnet (Dose vs. Kasten).
  function wochenPreise(history, d) {
    const gp     = parseFloat(d.grundpreis_wert || 0);
    const gpEinh = d.grundpreis_einheit_wert;
    const preis  = parseFloat(d.preis || 0);
    const nutzeGp = gp > 0 && d.vergleichsbasis !== "preis"
      && history.filter(h => h.grundpreis > 0 && h.grundpreis_einheit === gpEinh).length >= 2;
    const aktWoche = wochenStart(new Date().toISOString());

    const proWoche = {};
    for (const h of history) {
      const w = wochenStart(h.erfasst_am);
      if (w >= aktWoche) continue;
      let wert;
      if (nutzeGp) {
        if (!(h.grundpreis > 0) || h.grundpreis_einheit !== gpEinh) continue;
        wert = h.grundpreis * preis / gp;
      } else {
        wert = parseFloat(h.preis || 0);
        if (!(wert > 0)) continue;
      }
      proWoche[w] = Math.min(proWoche[w] ?? Infinity, wert);
    }
    const werte = Object.keys(proWoche).sort().map(w => proWoche[w]);
    werte.push(preis);
    return werte;
  }

  async function toggleHistory(idx) {
    const cardEl = document.getElementById(`card-${idx}`);
    const deal   = renderedDeals[idx];

    const existing = cardEl.querySelector('.price-history');
    if(existing) { existing.remove(); return; }

    const div = document.createElement('div');
    div.className = 'price-history';
    div.style.cssText = 'padding:12px 18px 14px;border-top:1px solid #1e3a5f';
    div.innerHTML = '<div style="color:#4a7fa5;font-size:12px">⏳ Lade Verlauf…</div>';
    cardEl.appendChild(div);

    try {
      // Gleiche Namenslogik wie die View: angebote.name ist "Name - Beschreibung",
      // preishistorie.name nur "Name".
      const basis = (deal.name || "").split(" - ")[0];
      const seit  = isoLokal(new Date(Date.now() - 182 * 86400000));
      const history = await sb(
        `preishistorie?select=preis,grundpreis,grundpreis_einheit,erfasst_am` +
        `&haendler=eq.${encodeURIComponent(deal.haendler)}` +
        `&name=eq.${encodeURIComponent(basis)}` +
        `&erfasst_am=gte.${seit}&order=erfasst_am.asc&limit=1000`
      );
      const prices = wochenPreise(history, deal);
      if (prices.length < 3) {
        div.innerHTML = '<div style="color:#4a7fa5;font-size:12px">📊 Noch nicht genug Verlaufsdaten (ab 2 früheren Aktionswochen verfügbar)</div>';
        return;
      }
      div.innerHTML = `<div style="font-size:12px;color:#7ca8cc;font-weight:600;margin-bottom:8px">📊 Preisverlauf (${prices.length - 1} frühere Wochen + jetzt)</div>${drawSparkline(prices)}`;
    } catch(e) {
      div.innerHTML = '<div style="color:#f87171;font-size:12px">Verlauf nicht verfügbar</div>';
    }
  }

  function renderDeals(deals) {
    renderedDeals = deals;
    const grid = document.getElementById("content");
    if (deals.length === 0) {
      grid.innerHTML = '<div class="error">Keine Angebote gefunden.</div>';
      return;
    }

    grid.innerHTML = `<div class="deals-grid">${deals.map((d,i) => {
      const preisNum    = parseFloat(d.preis || 0);
      const normNum     = parseFloat(d.normalpreis || 0);
      const hasDiscount = hasOfficialDiscount(d);
      const preis       = preisNum.toFixed(2);
      const norm        = normNum.toFixed(2);
      const rabatt      = hasDiscount ? parseFloat(d.rabatt_prozent || ((1 - preisNum / normNum) * 100)).toFixed(0) : null;
      const saved       = hasDiscount ? (normNum - preisNum).toFixed(2) : null;

      // Historischer Deal — nur wenn kein offizieller Rabatt vorliegt
      const histDeal    = isHistDeal(d);
      const histAvgNum  = parseFloat(d.preis_historisch_avg || 0);
      const histAvg     = histDeal ? histAvgNum.toFixed(2) : null;
      const histSaved   = histDeal ? (histAvgNum - preisNum).toFixed(2) : null;

      const expiry      = daysUntil(d.gueltig_bis);

      // App-/Karten-Angebote: siehe sql/2026-11_app_preis_view.sql im Forkcast-Repo
      const appNum      = parseFloat(d.app_preis || 0);
      const appText     = !d.app_name ? ""
        : appNum > 0 && appNum < preisNum ? `📱 ${appNum.toFixed(2)}€ mit ${d.app_name}`
        : appNum > 0 ? `📱 nur mit ${d.app_name}`
        : `📱 Extrapreis mit ${d.app_name}`;

      return `
        <div class="deal-card" id="card-${i}">
          <div class="deal-top">
            <div class="deal-store">${esc(d.haendler)}</div>
            <div class="deal-name">${esc(d.name)}</div>
            <div class="deal-unit">${esc(d.einheit)}</div>
          </div>
          <div class="deal-bottom">
            <div class="deal-price-block">
              <div class="deal-price">${preis}€</div>
              ${hasDiscount ? `<div class="deal-original">statt ${norm}€</div>` : ""}
              ${histDeal ? `<div class="deal-original">Ø sonst ${histAvg}€</div>` : ""}
              ${appText ? `<div class="deal-app">${esc(appText)}</div>` : ""}
            </div>
            ${hasDiscount ? `
            <div class="deal-badge">
              −${rabatt}%
              <div class="deal-badge-sub">−${saved}€</div>
            </div>` : ""}
            ${histDeal ? `
            <div class="deal-badge-hist">
              📉 Günstig
              <div class="deal-badge-hist-sub">−${histSaved}€</div>
            </div>` : ""}
          </div>
          ${expiry ? `<div class="gueltig" style="color:${expiry.color}">${expiry.text}</div>` : ""}
          <button class="history-btn" onclick="toggleHistory(${i})">
            📊 Preisverlauf anzeigen
          </button>
        </div>
      `;
    }).join("")}</div>`;
  }

  function filterStore(store) {
    activeStore = store;
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.toggle("active", (btn.dataset.store || "") === store);
    });
    if (!store) {
      renderDeals(allDeals);
      return;
    }
    renderDeals(allDeals.filter(d => d.haendler === store));
  }

  async function load() {
    try {
      const heute = isoLokal(new Date());
      // Nur aktuell gültige Angebote, die entweder einen Streichpreis haben
      // oder laut View ein historischer Deal sind (Filter läuft in Postgres).
      const [raw, haendlerRows] = await Promise.all([
        sbAll(
          `angebote_mit_historie?select=*` +
          `&gueltig_ab=lte.${heute}&gueltig_bis=gte.${heute}` +
          `&or=(ist_historischer_deal.is.true,normalpreis.not.is.null)` +
          `&order=gueltig_ab.desc,id.asc`
        ),
        sb(`haendler_aktuell?select=haendler`),
      ]);
      const haendler = haendlerRows.map(r => r.haendler).filter(Boolean).sort((a, b) => a.localeCompare(b, "de"));

      rawDeals = raw;
      const deals = raw
        .map(d => {
          const preis = parseFloat(d.preis || 0);
          const norm  = parseFloat(d.normalpreis || 0);
          if (!d.rabatt_prozent && norm > preis && preis > 0) {
            d.rabatt_prozent = ((1 - preis / norm) * 100).toFixed(1);
          }
          return d;
        })
        .filter(d => istIrgendeinDeal(d))
        .sort((a, b) => effRabatt(b) - effRabatt(a));

      allDeals = deals;

      const totalSaved = deals.reduce((s, d) => s + effSaved(d), 0);
      const avgSaved   = deals.length ? (totalSaved / deals.length) : 0;
      const topDeal    = deals.reduce((best, d) => effRabatt(d) > effRabatt(best) ? d : best, deals[0]);

      document.getElementById("stat-count").textContent = deals.length;
      document.getElementById("stat-avg").textContent   = `−${avgSaved.toFixed(2)}€`;
      document.getElementById("stat-top").textContent   = topDeal ? `−${effRabatt(topDeal).toFixed(0)}%` : "–";
      document.getElementById("stat-top-name").textContent = topDeal?.name?.substring(0,20) || "";
      document.getElementById("stats-row").style.display = "flex";

      const storesWithDeals = new Set(deals.map(d => d.haendler));
      const filterContainer = document.getElementById("store-filters");
      haendler
        .filter(h => storesWithDeals.has(h))
        .forEach(h => {
          const btn = document.createElement("button");
          btn.className = "filter-btn";
          btn.textContent = h;
          btn.dataset.store = h;
          btn.onclick = () => filterStore(h);
          filterContainer.appendChild(btn);
        });

      renderDeals(deals);

    } catch (e) {
      document.getElementById("content").innerHTML = `
        <div class="error">
          <div style="font-size:48px;margin-bottom:12px">⚠️</div>
          <div>Angebote konnten nicht geladen werden</div>
          <div style="font-size:13px;color:#64748b;margin-top:8px">${esc(e.message)}</div>
        </div>`;
    }
  }

  load();
</script>

</body>
</html>
