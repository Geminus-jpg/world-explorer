// ── Tabs ──────────────────────────────────────────────────────
const TAB_INFO={
  vor:{label:"🧭 Vor dem Test",color:C.green,bg:"#22c55e0d",bd:"#22c55e28",
    text:`Die Tore entscheiden den Termin, nicht der Kalender. Vorschlag bei rund 4 Abenden pro Woche: Eigentest ab 04.01.2027, Teststart Montag, 11.01.2027. Aufwand für dich allein, 1 Abend ≈ 3 Stunden. Kürzel wie D6, A3 oder R2 verweisen auf das <a href="https://claude.ai/artifact/9aDaNtsGg4L8K6XE9sGfeE" target="_blank" rel="noopener">Dokument „Daten, Preise und Prompt optimieren“</a>.`},
  test:{label:"🧪 Während des Tests",color:C.orange,bg:"#f973160d",bd:"#f9731628",
    text:"Vorschlag: 4 Wochen, Montag 11.01. bis Sonntag 07.02.2027, mit 3–5 Personen. Der Test startet erst, wenn Tor A und Tor B bestanden sind."},
  nach:{label:"📊 Nach dem Test",color:C.purple,bg:"#a855f70d",bd:"#a855f728",
    text:"Die Auswertung entscheidet die Reihenfolge. Vor einer öffentlichen Version müssen Datenquelle, Datenschutz und Kosten geklärt sein."},
};

// ── LocalStorage ──────────────────────────────────────────────
const LS='fk_roadmap_v1';
function getState(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch{return{}}}
function toggleItem(id){const s=getState();s[id]?delete s[id]:s[id]=true;try{localStorage.setItem(LS,JSON.stringify(s))}catch{}return!!s[id]}
function isDone(id){return!!getState()[id]}
// Feste Schlüssel: Haken bleiben beim Umsortieren am richtigen Eintrag
function itemId(ph,it,i){return it.k||ph.id+'_'+i}

// ── Helpers ───────────────────────────────────────────────────
function badge(txt,col){return`<span class="badge" style="background:${col}20;color:${col};border:1px solid ${col}40">${txt}</span>`}
function abende(x){const r=x>=10?Math.round(x):Math.round(x*2)/2;return String(r).replace('.',',')}
function phasesOf(tab){return PHASES.filter(p=>p.tab===tab)}
function itemsOf(tab){return phasesOf(tab).flatMap(p=>p.items.map((it,i)=>({it,id:itemId(p,it,i)})))}
function sumA(ph){return ph.items.reduce((s,it)=>s+(it.a||0),0)}
function aufwand(a){if(!a)return'';if(a<1)return' · unter 1 Abend';const r=abende(a);return` · rund ${r} ${r==='1'?'Abend':'Abende'}`}

// ── Render done ───────────────────────────────────────────────
function renderDone(){
  let html=`<div class="info-box" style="background:#22c55e0d;border:1px solid #22c55e28">
    <span style="color:#22c55e;font-weight:700">✅ ${DONE.length} Features erfolgreich umgesetzt</span>
    <span style="color:#4a7fa5;margin-left:8px">— Solide Basis für alle weiteren Phasen.</span>
  </div>`;
  DONE_GROUPS.forEach(g=>{
    html+=`<div class="sec">${g.label}</div><div class="done-wrap">`;
    g.idx.forEach(i=>{
      const it=DONE[i];
      html+=`<div class="done-item"><div class="done-tick">✓</div><div style="flex:1"><div class="done-t">${it.e} ${it.t}</div>${it.d?`<div class="done-d">${it.d}</div>`:''}</div></div>`;
    });
    html+=`</div>`;
  });
  return html;
}

// ── Render phase ──────────────────────────────────────────────
function renderPhase(ph){
  const chk=ph.items.filter((it,i)=>isDone(itemId(ph,it,i))).length;
  const tot=ph.items.length;
  const pct=Math.round(chk/tot*100);
  const a=sumA(ph);
  let html=`<div class="phase-box">
    <div class="phase-title" style="color:${ph.color}">${ph.label} — ${ph.sub}</div>
    <div class="phase-meta">⏱ ${ph.timeline}${aufwand(a)}</div>
    <div class="phase-desc">${ph.desc}</div>
    <div class="phase-pb"><div class="phase-pf" id="ppf_${ph.id}" style="width:${pct}%;background:${ph.color}"></div></div>
    <div class="phase-pl" id="ppl_${ph.id}">${chk} / ${tot} erledigt (${pct}%)</div>
  </div>`;
  ph.items.forEach((it,i)=>{
    const id=itemId(ph,it,i);
    const done=isDone(id);
    html+=`<div class="card ${it.gate?'gate':''} ${done?'ck':''}" id="card_${id}">
      <div class="card-head" onclick="cardClick(event,'${id}')">
        <div class="chk ${done?'on':''}" id="chk_${id}" onclick="checkClick(event,'${id}')">✓</div>
        <span class="card-emoji">${it.e}</span>
        <div class="card-body">
          <div class="card-title">${it.t}${it.neu?badge('✨ Neu',C.purple):''}
          </div>
          <div class="card-badges">${it.gate?badge('🚦 Tor',C.yellow):''}${badge('⏱ '+it.effort,ph.color)}${it.ref?badge(it.ref,C.muted):''}</div>
        </div>
        <span class="arrow">▼</span>
      </div>
      <div class="detail">${it.d}</div>
    </div>`;
  });
  return html;
}

// ── Render tab ────────────────────────────────────────────────
function renderIntro(tab){
  const t=TAB_INFO[tab];
  return `<div class="info-box" style="background:${t.bg};border:1px solid ${t.bd}">
    <div class="ib-t" style="color:${t.color}" id="intro_${tab}">${introTitle(tab)}</div>
    <div class="ib-d">${t.text}</div>
  </div>`;
}
function introTitle(tab){
  const items=itemsOf(tab);
  const offen=items.filter(x=>!isDone(x.id));
  if(tab==='vor'){
    const ges=items.reduce((s,x)=>s+(x.it.a||0),0);
    const rest=offen.reduce((s,x)=>s+(x.it.a||0),0);
    return offen.length?`Noch rund ${abende(rest)} von ${abende(ges)} Abenden bis zum Test, dazu eine Woche Eigentest`:`Alles erledigt: bereit für den Test`;
  }
  return `${items.length-offen.length} / ${items.length} erledigt`;
}
function renderTab(id){
  if(id==='done')return renderDone();
  return renderIntro(id)+phasesOf(id).map(renderPhase).join('');
}

// ── Handlers ──────────────────────────────────────────────────
function checkClick(ev,id){
  ev.stopPropagation();
  const now=toggleItem(id);
  document.getElementById('chk_'+id).classList.toggle('on',now);
  document.getElementById('card_'+id).classList.toggle('ck',now);
  refreshAll();
}
function cardClick(ev,id){
  if(ev.target.classList.contains('chk')||ev.target.closest('.chk'))return;
  document.getElementById('card_'+id).classList.toggle('open');
}
function refreshPhase(pid){
  const ph=PHASES.find(p=>p.id===pid);if(!ph)return;
  const chk=ph.items.filter((it,i)=>isDone(itemId(ph,it,i))).length;
  const tot=ph.items.length;const pct=Math.round(chk/tot*100);
  const pf=document.getElementById('ppf_'+pid);
  const pl=document.getElementById('ppl_'+pid);
  if(pf)pf.style.width=pct+'%';
  if(pl)pl.textContent=`${chk} / ${tot} erledigt (${pct}%)`;
}
function refreshOverall(){
  const totOpen=PHASES.reduce((s,p)=>s+p.items.length,0);
  const chkOpen=PHASES.reduce((s,p)=>s+p.items.filter((it,i)=>isDone(itemId(p,it,i))).length,0);
  const total=DONE.length+totOpen;
  const done=DONE.length+chkOpen;
  document.getElementById('ot').textContent=`${done} / ${total} erledigt`;
  document.getElementById('of').style.width=Math.round(done/total*100)+'%';
  const vor=itemsOf('vor');const vorDone=vor.filter(x=>isDone(x.id)).length;
  document.getElementById('vt').textContent=`${vorDone} / ${vor.length} erledigt`;
  document.getElementById('vf').style.width=Math.round(vorDone/vor.length*100)+'%';
}
function refreshAll(){
  PHASES.forEach(p=>refreshPhase(p.id));
  Object.keys(TAB_INFO).forEach(t=>{const el=document.getElementById('intro_'+t);if(el)el.textContent=introTitle(t)});
  refreshOverall();
}

// ── Tab logic ─────────────────────────────────────────────────
let curTab='vor';
const TABS=[
  {id:'done',label:'✅ Erledigt',count:DONE.length},
  ...Object.keys(TAB_INFO).map(id=>({id,label:TAB_INFO[id].label,count:itemsOf(id).length}))
];

function switchTab(id){
  curTab=id;
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tb').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelector(`.tb[data-id="${id}"]`).classList.add('active');
  const el=document.getElementById('tab-'+id);
  if(!el.innerHTML)el.innerHTML=renderTab(id);
}

// ── Init ──────────────────────────────────────────────────────
document.getElementById('tab-bar').innerHTML=TABS.map(t=>
  `<button class="tb ${t.id===curTab?'active':''}" data-id="${t.id}" onclick="switchTab('${t.id}')">
    ${t.label}<span class="tc">${t.count}</span>
  </button>`).join('');

document.getElementById('tab-'+curTab).innerHTML=renderTab(curTab);
refreshOverall();
</script>
